[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phish-triage"
version = "0.1.0"
description = "Phishing email triage: deterministic indicators + optional LLM analyst summary (OpenAI-compatible, works with local models)."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "nullvector-ai"}]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
phish-triage = "phish_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
